# Flatpak manifest for tron, built into a .flatpak bundle by the release workflow.
#
#   flatpak-builder --user --install --force-clean build dist/flatpak/dev.tron.Terminal.yml
#
# A terminal is only useful with the host's shell and tools, so tron runs shells
# on the host through flatpak-spawn (org.freedesktop.Flatpak) and can read files
# anywhere, for dropped paths and image transfers.
app-id: dev.tron.Terminal
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
command: tron
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=host
  - --talk-name=org.freedesktop.Flatpak
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.a11y.Bus
build-options:
  append-path: /run/build/tron/cargo-home/bin
  # Crates are downloaded during the build; the bundle is not built for Flathub.
  build-args:
    - --share=network
  env:
    CARGO_HOME: /run/build/tron/cargo-home
    RUSTUP_HOME: /run/build/tron/rustup-home
modules:
  - name: tron
    buildsystem: simple
    build-commands:
      # The Flathub rust-stable extension trails stable Rust and can fall below
      # rust-version, so rustup installs the latest stable, as in the other
      # release jobs.
      - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable --no-modify-path
      - cargo build --release --locked -p tron
      - install -Dm755 target/release/tron /app/bin/tron
      - install -Dm644 dist/dev.tron.Terminal.desktop /app/share/applications/dev.tron.Terminal.desktop
      - install -Dm644 dist/dev.tron.Terminal.metainfo.xml /app/share/metainfo/dev.tron.Terminal.metainfo.xml
      - install -Dm644 dist/dev.tron.Terminal.svg /app/share/icons/hicolor/scalable/apps/dev.tron.Terminal.svg
      - install -Dm644 dist/dev.tron.Terminal.png /app/share/icons/hicolor/256x256/apps/dev.tron.Terminal.png
    sources:
      - type: dir
        path: ../..
        skip:
          - target
          - .git
          - .flatpak-builder
